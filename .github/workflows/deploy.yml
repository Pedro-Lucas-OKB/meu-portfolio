name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Autentica na AWS via OIDC (sem access key salva como secret).
      # A role é criada pelo módulo infra/oidc; o ARN vem do output
      # github_actions_role_arn.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::963990211877:role/pedrolucas-portfolio-gh-actions
          aws-region: us-east-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Build
        working-directory: site
        run: npm run build

      - name: Sync to S3
        run: aws s3 sync site/dist s3://pedrolucas.dev.br --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E24R25N80WOKZ9 --paths "/*"
